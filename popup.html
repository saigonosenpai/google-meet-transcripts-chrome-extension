<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>Meet Transcripts</h1>
  </header>

  <section id="status" class="card">
    <div class="row"><span id="dot" class="dot"></span><strong id="state">Checking…</strong></div>
    <p id="detail" class="muted"></p>
    <div class="actions" id="meetActions" hidden>
      <button id="pause"></button>
      <button id="viewCurrent">View live transcript</button>
    </div>
  </section>

  <section class="card settings">
    <label><input type="checkbox" id="autoCaptions"> Turn on captions automatically</label>
    <label><input type="checkbox" id="hideCaptions"> Hide the caption overlay while recording</label>
    <label class="name">Your name <input type="text" id="myName" placeholder="replaces “You”"></label>
  </section>

  <section class="card files">
    <div class="row"><svg class="gicon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2b579a" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path fill="#a5bde3" d="M14 2v6h6z"/><path fill="#fff" d="M7.5 11h1.6l.9 4.2 1.1-4.2h1.3l1.1 4.2.9-4.2h1.6l-1.7 6.5h-1.4l-1.1-4.1-1.1 4.1H9.2z"/></svg>
      <strong>Word documents</strong></div>
    <label><input type="checkbox" id="autoSave"> Save each call as a .docx</label>
    <p class="muted small">Saved to <code>Downloads/Meet Transcripts</code>, named
      <code>Date - Event - Participants</code>. Opens in Word, Pages or Google Docs.</p>
    <p id="lastSaved" class="muted small"></p>
    <div id="askWarning" class="warn small" hidden>
      Chrome is set to ask where to save each file, so transcripts can't save automatically.
      <button id="dlSettings" class="link">Change this setting</button>
    </div>
    <button id="showFolder">Show folder</button>
  </section>

  <button id="openViewer" class="primary">All transcripts</button>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
