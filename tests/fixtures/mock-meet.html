<!doctype html>
<html><head><title>Meet</title></head>
<body>
<!-- Mimics Meet's caption DOM: one block per speaker turn, text revised in place. -->
<!-- Account button from the "Ready to join?" screen; the extension reads your name from it. -->
<a aria-label="Google Account: Sam Lee  (sam@example.com)" href="#">S</a>
<button aria-label="Turn on captions (c)" aria-pressed="false" id="cc">CC</button>
<div data-participant-id="p1"><div class="zWGUib">Alice</div></div>
<div data-participant-id="p2"><div class="zWGUib">Bob</div></div>
<div data-participant-id="p3"><div class="zWGUib">Carol</div></div>
<div data-participant-id="p4"><div data-self-name="You" class="zWGUib notranslate">You</div></div>
<script>
// Calendar meetings show their title in the tab; spontaneous calls show only the code.
const scheduled = location.pathname === "/abc-defg-hij";
document.title = scheduled ? "Meet - Weekly sync" : "Meet - " + location.pathname.slice(1);
let region = null;
document.getElementById("cc").onclick = (e) => {
  e.target.setAttribute("aria-pressed", "true");
  e.target.setAttribute("aria-label", "Turn off captions (c)");
  region = document.createElement("div");
  region.setAttribute("role", "region");
  region.setAttribute("aria-label", "Captions");
  document.body.append(region);
  run();
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function block(name) {
  const b = document.createElement("div");
  b.className = "nMcdL";
  b.innerHTML = '<div class="adE6rb"><img><div class="KcIKyf"><span class="NWpY1d"></span></div></div><div class="ygicle"></div>';
  b.querySelector(".NWpY1d").textContent = name;
  region.append(b);
  return b.querySelector(".ygicle");
}
async function run() {
  let t = block("Alice");
  for (const s of ["so", "so the", "so the launch", "So the launch is next", "So the launch is next Friday.",
                   "So the launch is next Friday. Can you send the deck by Thursday?"]) { t.textContent = s; await wait(120); }
  t = block("You");
  for (const s of ["yes", "Yes, I will send it.", "Yes, I will send it. We agreed to go with option B."]) { t.textContent = s; await wait(120); }
  // Long monologue whose front gets trimmed by Meet.
  t = block("Bob");
  let full = "";
  for (let i = 1; i <= 30; i++) {
    full += `Sentence number ${i} talks about the roadmap in detail. `;
    const shown = full.length > 500 ? full.slice(full.length - 500).replace(/^\S*\s/, "") : full;
    t.textContent = shown.trim();
    await wait(80);
  }
  await wait(300);
  region.firstElementChild.remove(); // old blocks scroll away
  t = block("Alice");
  t.textContent = "Great, thanks everyone.";
  window.done = true;
}
// Leaving the call: Meet swaps the call UI for a "You left the meeting" screen.
window.leave = () => {
  document.body.innerHTML = "<h1>You left the meeting</h1><button>Rejoin</button>";
};
</script>
</body></html>
