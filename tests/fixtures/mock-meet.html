<!doctype html>
<html><head><title>Meet</title>
<style>
  /* Like Meet: the bottom bar holds the caption strip and the controls, and the video stage
     is sized by script from what that bar leaves, recalculated only when the window resizes. */
  body { margin: 0; height: 100vh; overflow: hidden; }
  #stage { overflow: hidden; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; }
  #capbar { padding: 12px 0; }
  #capbar > div { min-height: 140px; }
  #controls { height: 80px; }
</style></head>
<body>
<main id="stage"><video></video>
<!-- Mimics Meet's caption DOM: one block per speaker turn, text revised in place. -->
<!-- Account button from the "Ready to join?" screen; the extension reads your name from it. -->
<a aria-label="Google Account: Sam Lee  (sam@example.com)" href="#">S</a>
<div data-participant-id="p1"><div class="zWGUib">Alice</div></div>
<!-- Real tiles carry icon glyphs (pin, framing) marked notranslate, ahead of the name. -->
<div data-participant-id="p2"><button><i class="google-symbols notranslate" aria-hidden="true">keep_outline</i></button><div class="zWGUib">Bob</div></div>
<!-- ...and the name element can hold a second, hidden (sometimes truncated) copy of the name. -->
<div data-participant-id="p3"><span class="notranslate">frame_person</span><div class="notranslate"><span>Carol Diaz</span><span style="display:none">Carol D</span></div></div>
<div data-participant-id="p4"><div data-self-name="You" class="zWGUib notranslate">You</div></div>
</main>
<div id="bottom">
  <!-- The caption strip, above the controls; empty until captions are on. -->
  <div id="capbar" hidden><div></div></div>
  <footer id="controls"><button aria-label="Turn on captions (c)" aria-pressed="false" id="cc">CC</button>
    <button aria-label="Turn off microphone">Mic</button><button aria-label="Leave call">Leave</button></footer>
</div>
<script>
// Calendar meetings show their title in the tab; spontaneous calls show only the code.
const scheduled = location.pathname === "/abc-defg-hij";
document.title = scheduled ? "Meet - Weekly sync" : "Meet - " + location.pathname.slice(1);
let region = null;
const layoutStage = () => {
  document.getElementById("stage").style.height = innerHeight - document.getElementById("bottom").offsetHeight + "px";
};
addEventListener("resize", layoutStage);
layoutStage();
document.getElementById("cc").onclick = (e) => {
  e.target.setAttribute("aria-pressed", "true");
  e.target.setAttribute("aria-label", "Turn off captions (c)");
  region = document.createElement("div");
  region.setAttribute("role", "region");
  region.setAttribute("aria-label", "Captions");
  document.getElementById("capbar").hidden = false;
  document.querySelector("#capbar > div").append(region);
  layoutStage();
  run();
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function block(name) {
  const b = document.createElement("div");
  b.className = "nMcdL";
  b.innerHTML = '<div class="adE6rb"><img><div class="KcIKyf"><span class="NWpY1d"></span></div></div><div class="ygicle"></div>';
  b.querySelector(".NWpY1d").textContent = name;
  region.append(b);
  return b.querySelector(".ygicle");
}
async function run() {
  let t = block("Alice");
  for (const s of ["so", "so the", "so the launch", "So the launch is next", "So the launch is next Friday.",
                   "So the launch is next Friday. Can you send the deck by Thursday?"]) { t.textContent = s; await wait(120); }
  t = block("You");
  for (const s of ["yes", "Yes, I will send it.", "Yes, I will send it. We agreed to go with option B."]) { t.textContent = s; await wait(120); }
  // Long monologue whose front gets trimmed by Meet.
  t = block("Bob");
  let full = "";
  for (let i = 1; i <= 30; i++) {
    full += `Sentence number ${i} talks about the roadmap in detail. `;
    const shown = full.length > 500 ? full.slice(full.length - 500).replace(/^\S*\s/, "") : full;
    t.textContent = shown.trim();
    await wait(80);
  }
  await wait(300);
  region.firstElementChild.remove(); // old blocks scroll away
  t = block("Alice");
  t.textContent = "Great, thanks everyone.";
  window.done = true;
}
// Leaving the call: Meet swaps the call UI for a "You left the meeting" screen.
window.leave = () => {
  document.body.innerHTML = "<h1>You left the meeting</h1><button>Rejoin</button>";
};
</script>
</body></html>
