# Publishes a GitHub release whenever main carries a manifest version that hasn't been released yet.
# To ship an update: bump "version" in manifest.json, add a "## <version>" section to CHANGELOG.md, push.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, to check where an existing release points

      - name: Check whether this version is already released
        id: version
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tagged=$(git rev-list -n 1 "v$version" 2> /dev/null || true)
          if gh release view "v$version" > /dev/null 2>&1 && [ -n "$tagged" ] && git merge-base --is-ancestor "$tagged" HEAD; then
            echo "Release v$version already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" > /dev/null 2>&1; then
            # The release's commit is no longer on main (history was rewritten): publish it again.
            echo "Release v$version points outside main's history; replacing it."
            gh release delete "v$version" --cleanup-tag --yes
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22

      - name: Build the extension zip
        if: steps.version.outputs.new == 'true'
        run: |
          # The extension lives at the top of the repo (so GitHub's own Download ZIP loads too);
          # the release zip holds just the extension, plus the license and install notes.
          # The files sit at the top of the zip, so the folder that unzipping creates (on Windows
          # and Mac alike) is the one to pick in Load unpacked: no inner folder to miss.
          # Named after the extension, so its folder isn't mistaken for the transcripts folder
          # (Downloads/Meeting Transcripts). Two copies: one named with the version, and one with
          # a fixed name for the stable link releases/latest/download/meet-transcripts-chrome-extension.zip.
          version=$(jq -r .version manifest.json)
          mkdir -p dist/pkg
          cp -r manifest.json background.js content icons lib popup viewer dist/pkg/
          cp LICENSE README.md docs/INSTALL.txt dist/pkg/
          (cd dist/pkg && zip -qr ../meet-transcripts-chrome-extension.zip .)
          cp dist/meet-transcripts-chrome-extension.zip "dist/meet-transcripts-chrome-extension-$version.zip"

      - name: Run the end-to-end test on the zip's contents
        if: steps.version.outputs.new == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/e2e.mjs dist/pkg "$RUNNER_TEMP"

      - name: Write the release notes
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Version $version." > notes.md; fi
          cat >> notes.md <<NOTES

          ---

          **Install:** download \`meet-transcripts-chrome-extension-$version.zip\` below (the other zip is the same file) and unzip it into a permanent place, such as Downloads or Documents. Open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and select the unzipped folder (the one with \`manifest.json\` in it).

          **Update:** copy the new files over your existing extension folder, replacing them, then click the reload arrow (↻) on the extension in \`chrome://extensions\`. Don't click Remove.

          Full instructions are in the [README](https://github.com/${{ github.repository }}#readme).
          NOTES

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          gh release create "v$version" "dist/meet-transcripts-chrome-extension-$version.zip" \
            "dist/meet-transcripts-chrome-extension.zip" \
            --title "$(jq -r .name manifest.json) $version" --notes-file notes.md --target "$GITHUB_SHA"
